<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;

      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .logo {
      max-width: 200px;
      margin-bottom: 20px;

    }
    p {

      border: 3px solid #d9305f;
      padding: 10px 25px;
      display: inline-block;
      transform: rotate(-5deg);
      background: #fff;
    }
    footer {
      position: absolute;
      bottom: 15px;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>
  <img src="quieroregalo_logo.png" alt="Quiero Regalo" class="logo">
